<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Obsidian Base -->
  <rect width="600" height="600" fill="#0A0D12"/>

  <!-- Centered Symbol -->
  <g transform="translate(180, 80) scale(0.30)">
    <path d="M 160 160 H 280 V 640 H 160 Z" fill="#FFFFFF"/>
    <path d="M 280 160 H 440 L 520 240 V 320 L 440 400 H 280 Z 
             M 280 250 H 400 L 430 280 V 280 L 400 310 H 280 Z" 
          fill="#FFFFFF" fill-rule="evenodd"/>
    <path d="M 280 400 L 520 640 H 640 L 400 400 Z" fill="#FFFFFF"/>
    <path d="M 520 160 H 640 V 480 L 520 360 Z" fill="#FFFFFF"/>
    <polygon points="400,400 520,360 480,480" fill="#0052FF"/>
  </g>

  <!-- Centered Typography -->
  <text x="300" y="380" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="36" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#FFFFFF">
    RIPPLE NEXUS
  </text>

  <text x="300" y="420" 
        text-anchor="middle"
        font-family="'JetBrains Mono', monospace" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#8A99AD">
    SYSTEMS ARCHITECTURE &amp; AI
  </text>
</svg>
