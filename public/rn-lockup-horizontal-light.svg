  <g transform="translate(40, 20) scale(0.25)">
    <path d="M 160 160 H 280 V 640 H 160 Z" fill="#0A0D12"/>
    <path d="M 280 160 H 440 L 520 240 V 320 L 440 400 H 280 Z 
             M 280 250 H 400 L 430 280 V 280 L 400 310 H 280 Z" 
          fill="#0A0D12" fill-rule="evenodd"/>
    <path d="M 280 400 L 520 640 H 640 L 400 400 Z" fill="#0A0D12"/>
    <path d="M 520 160 H 640 V 480 L 520 360 Z" fill="#0A0D12"/>
