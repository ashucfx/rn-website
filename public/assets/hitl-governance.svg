<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hitlCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A212E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141923" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="hitlGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2633" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#0A0D12"/>
  <rect width="1000" height="600" fill="url(#hitlGrid)"/>

  <!-- Telemetry Header -->
  <text x="40" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF" letter-spacing="3">GOVERNANCE // HUMAN-IN-THE-LOOP (HITL) DETERMINISTIC VERIFICATION GATE</text>
  <text x="760" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" letter-spacing="2">DUAL-KEY ENTERPRISE CONSENSUS</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#1F2633" stroke-width="1"/>

  <!-- AI Inference Node -->
  <g transform="translate(60, 150)">
    <rect width="220" height="300" rx="8" fill="url(#hitlCardBg)" stroke="#1F2633" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#0052FF"/>
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">INPUT STAGE</text>
    <text x="20" y="58" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Autonomous Agent Inference</text>
    <text x="20" y="86" font-family="'Inter', sans-serif" font-size="12" fill="#8A99AD">Pipeline computes state proposals, tool execution requests, or contract generations.</text>
    
    <g transform="translate(20, 130)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">MODEL: MISTRAL-LARGE</text>
    </g>

    <g transform="translate(20, 185)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">UNCERTAINTY: 0.041</text>
    </g>

    <g transform="translate(20, 240)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#0052FF"/>
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">CONFIDENCE: 95.9%</text>
    </g>
  </g>

  <!-- Flow to Threshold Splitter -->
  <line x1="280" y1="300" x2="360" y2="300" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="356,296 364,300 356,304" fill="#00D2FF"/>

  <!-- Decision Gate Core -->
  <g transform="translate(360, 180)">
    <!-- Decision Diamond -->
    <polygon points="120,0 240,120 120,240 0,120" fill="#141923" stroke="#0052FF" stroke-width="2"/>
    <text x="64" y="115" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">CONFIDENCE</text>
    <text x="80" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF">&gt;= 98.0% ?</text>
  </g>

  <!-- High-Confidence Direct Path (Down) -->
  <path d="M 480 340 L 480 470 L 700 470" stroke="#0052FF" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="495" y="440" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0052FF">HIGH CONFIDENCE (AUTOMATED PASS)</text>

  <!-- Low/Med Confidence Path (Up/Right) -->
  <line x1="480" y1="260" x2="480" y2="170" stroke="#00D2FF" stroke-width="2"/>
  <line x1="480" y1="170" x2="570" y2="170" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="566,166 574,170 566,174" fill="#00D2FF"/>
  <text x="490" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">THRESHOLD NOT MET // TRIGGER HITL</text>

  <!-- HITL Human Reviewer Enclave -->
  <g transform="translate(570, 90)">
    <rect width="370" height="240" rx="8" fill="url(#hitlCardBg)" stroke="#00D2FF" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="4" rx="2" fill="#00D2FF"/>
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">CHECKPOINT // HITL ARBITRATION</text>
    <text x="24" y="58" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Dual-Key Engineer Verification</text>
    <text x="24" y="82" font-family="'Inter', sans-serif" font-size="12" fill="#8A99AD">Critical state alterations require explicit cryptographic signatures from certified systems engineers before production state mutation.</text>

    <!-- Key Signers -->
    <g transform="translate(24, 110)">
      <rect width="322" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <circle cx="20" cy="22" r="4" fill="#00D2FF"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">KEY 1: SENIOR ARCHITECT // SIGNED [0x8A12]</text>
    </g>

    <g transform="translate(24, 170)">
      <rect width="322" height="44" rx="4" fill="#0A0D12" stroke="#0052FF"/>
      <circle cx="20" cy="22" r="4" fill="#0052FF"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">KEY 2: SECURITY OFFICER // SIGNED [0x99FF]</text>
    </g>
  </g>

  <!-- Final Commit Tier -->
  <g transform="translate(700, 420)">
    <rect width="240" height="100" rx="8" fill="#141923" stroke="#0052FF" stroke-width="1.5"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">COMMIT PHASE</text>
    <text x="20" y="54" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Production DB Mutation</text>
    <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">IMMUTABLE LOG RECORDED</text>
    <circle cx="210" cy="50" r="6" fill="#00D2FF"/>
  </g>

  <!-- Connector from HITL to Commit -->
  <path d="M 755 330 L 755 420" stroke="#00D2FF" stroke-width="2"/>
  <polygon points="751,414 755,422 759,414" fill="#00D2FF"/>
</svg>
