<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="secCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A212E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141923" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="secGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2633" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" fill="#0A0D12"/>
  <rect width="1000" height="600" fill="url(#secGrid)"/>

  <!-- Telemetry Header -->
  <text x="40" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF" letter-spacing="3">SECURITY_ENCLAVE // ZERO-TRUST HSM &amp; IMMUTABLE AUDIT LEDGER</text>
  <text x="760" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0052FF" letter-spacing="2">FIPS 140-2 LEVEL 3 VALIDATED</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#1F2633" stroke-width="1"/>

  <!-- Left: CloudHSM & KMS Key Custody -->
  <g transform="translate(60, 100)">
    <rect width="410" height="320" rx="8" fill="url(#secCardBg)" stroke="#0052FF" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#0052FF"/>
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF">KEY CUSTODY // DEDICATED HARDWARE HSM</text>
    <text x="24" y="60" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Customer-Controlled Encryption</text>
    <text x="24" y="86" font-family="'Inter', sans-serif" font-size="13" fill="#8A99AD">Your keys never leave your dedicated hardware security modules. We enforce BYOK (Bring Your Own Key) architecture with zero vendor retention.</text>
    
    <g transform="translate(24, 115)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <circle cx="20" cy="22" r="4" fill="#0052FF"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">KMS ARN: arn:aws:kms:us-east-1:tenant-cmk</text>
    </g>

    <g transform="translate(24, 175)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <circle cx="20" cy="22" r="4" fill="#00D2FF"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">ENCRYPTION: AES-GCM 256 + RSA-4096 SIGNING</text>
    </g>

    <g transform="translate(24, 235)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <circle cx="20" cy="22" r="4" fill="#0052FF"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF">ROTATION: AUTOMATED 90-DAY KEY CYCLING</text>
    </g>
  </g>

  <!-- Right: Immutable Merkle Audit Ledger -->
  <g transform="translate(530, 100)">
    <rect width="410" height="320" rx="8" fill="url(#secCardBg)" stroke="#1F2633" stroke-width="1.5"/>
    <rect x="0" y="0" width="410" height="4" rx="2" fill="#00D2FF"/>
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00D2FF">AUDIT VERIFIABILITY // APPEND-ONLY</text>
    <text x="24" y="60" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Cryptographic Event Chain</text>
    <text x="24" y="86" font-family="'Inter', sans-serif" font-size="13" fill="#8A99AD">Every system operation, data access, and API call produces a cryptographically signed Merkle receipt exported to immutable S3 Object Lock.</text>

    <!-- Audit Entries -->
    <g transform="translate(24, 115)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">HASH: e3b0c442...98fc</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">PASS [HITL_OK]</text>
    </g>

    <g transform="translate(24, 175)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">HASH: 8f434346...a102</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">PASS [RBAC_V2]</text>
    </g>

    <g transform="translate(24, 235)">
      <rect width="362" height="44" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8A99AD">HASH: 12ab790c...5f91</text>
      <text x="230" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">PASS [mTLS_VERIFIED]</text>
    </g>
  </g>

  <!-- Compliance Badges Bottom -->
  <g transform="translate(60, 450)">
    <rect width="880" height="90" rx="8" fill="#141923" stroke="#1F2633"/>
    
    <g transform="translate(40, 25)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#00D2FF"/>
      <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00D2FF">SOC 2 TYPE II</text>
    </g>

    <g transform="translate(250, 25)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#0052FF"/>
      <text x="32" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">HIPAA READY</text>
    </g>

    <g transform="translate(460, 25)">
      <rect width="180" height="40" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="36" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">ISO 27001</text>
    </g>

    <g transform="translate(670, 25)">
      <rect width="170" height="40" rx="4" fill="#0A0D12" stroke="#1F2633"/>
      <text x="28" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#8A99AD">ZERO-BREACH SLA</text>
    </g>
  </g>
</svg>
